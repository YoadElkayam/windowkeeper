name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Typecheck the examples against the built package
        run: npx tsc -p tsconfig.examples.json
      - name: Smoke the CLI against the example transcript
        run: node dist/cli.js explain docs/examples/transcript.json -p docs/examples/policy.json
      - name: Smoke the benchmark on a generated session
        run: |
          node bench/synth.mjs /tmp/long-session.json --calls 60
          node bench/replay.mjs /tmp/long-session.json --json > /tmp/bench.json
          node -e "const r=require('/tmp/bench.json').results; if (r.windowkeeper.itemsLost!==0) { console.error('windowkeeper lost items'); process.exit(1) }"
